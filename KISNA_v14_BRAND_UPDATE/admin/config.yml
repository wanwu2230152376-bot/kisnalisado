backend:
  name: git-gateway
  branch: main

site_url: "https://kisnalisado.es"
display_url: "https://kisnalisado.es"
logo_url: "https://kisnalisado.es/assets/hero-model.jpg"

locale: es
publish_mode: simple
media_folder: "assets/resultados"
public_folder: "/assets/resultados"

collections:
  - name: "resultados"
    label: "Resultados antes y después"
    files:
      - name: "galeria"
        label: "Galería de resultados"
        file: "data/resultados.json"
        format: "json"
        fields:
          - label: "Casos"
            name: "casos"
            widget: "list"
            summary: "{{fields.titulo}} — {{fields.detalle}}"
            minimize_collapsed: true
            fields:
              - { label: "Título", name: "titulo", widget: "string", hint: "Ejemplo: Alisado Japonés" }
              - { label: "Tipo de cabello", name: "detalle", widget: "string", hint: "Ejemplo: Pelo afro" }
              - { label: "Descripción para Google", name: "descripcion", widget: "text", required: false, hint: "Ejemplo: Resultado real de alisado japonés para cabello afro muy rizado en KISNA Madrid." }
              - { label: "Foto antes", name: "antes", widget: "image" }
              - { label: "Foto después", name: "despues", widget: "image" }
              - { label: "Texto alternativo foto antes", name: "alt_antes", widget: "string", required: false }
              - { label: "Texto alternativo foto después", name: "alt_despues", widget: "string", required: false }
              - { label: "Mostrar en la web", name: "publicado", widget: "boolean", default: true }
