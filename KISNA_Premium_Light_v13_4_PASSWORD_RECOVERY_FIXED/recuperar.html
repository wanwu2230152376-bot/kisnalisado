<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Restablecer contraseña | KISNA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --cream: #f7f1e8;
      --gold: #9a743c;
      --text: #2c2822;
      --muted: #746d63;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      font-family: Montserrat, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(210,181,130,.28), transparent 42%),
        linear-gradient(145deg, #fbf8f2, var(--cream));
    }
    main {
      width: min(100%, 460px);
      padding: 36px 28px;
      text-align: center;
      border: 1px solid rgba(154,116,60,.25);
      border-radius: 24px;
      background: rgba(255,255,255,.9);
      box-shadow: 0 22px 60px rgba(61,49,32,.12);
    }
    .brand {
      margin: 0;
      font-family: "Cormorant Garamond", serif;
      font-size: 44px;
      letter-spacing: .12em;
      color: var(--gold);
    }
    .tagline {
      margin: 0 0 28px;
      font-size: 11px;
      letter-spacing: .22em;
      color: var(--muted);
    }
    h1 {
      margin: 0 0 12px;
      font-family: "Cormorant Garamond", serif;
      font-size: 34px;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.65;
    }
    .spinner {
      width: 34px;
      height: 34px;
      margin: 24px auto;
      border: 3px solid rgba(154,116,60,.2);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    .error {
      display: none;
      margin-top: 20px;
      padding: 13px;
      color: #982f2f;
      background: #fff0f0;
      border: 1px solid #efcaca;
      border-radius: 12px;
    }
    a { color: var(--gold); }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <main>
    <p class="brand">KISNA</p>
    <p class="tagline">EXPERTO EN ALISADO</p>
    <h1>Restablecer contraseña</h1>
    <div class="spinner" aria-hidden="true"></div>
    <p id="status">Estamos verificando tu enlace. El formulario para crear una contraseña aparecerá automáticamente.</p>
    <p id="error" class="error"></p>
  </main>

  <script>
  (function () {
    var errorBox = document.getElementById("error");
    var status = document.getElementById("status");
    var hash = window.location.hash || "";

    if (!/^#\/?recovery_token=/.test(hash)) {
      document.querySelector(".spinner").style.display = "none";
      status.textContent = "Este enlace no contiene un código de recuperación válido.";
      errorBox.style.display = "block";
      errorBox.innerHTML = 'Solicita un nuevo correo desde Netlify y abre solamente el enlace más reciente. Después podrás entrar en <a href="/admin/">/admin/</a>.';
      return;
    }

    if (!window.netlifyIdentity) {
      document.querySelector(".spinner").style.display = "none";
      errorBox.style.display = "block";
      errorBox.textContent = "No se pudo cargar el servicio de acceso. Comprueba la conexión y vuelve a abrir el enlace.";
      return;
    }

    window.netlifyIdentity.setLocale("es");

    window.netlifyIdentity.on("login", function () {
      window.netlifyIdentity.close();
      window.location.replace("/admin/");
    });

    window.netlifyIdentity.on("error", function (error) {
      document.querySelector(".spinner").style.display = "none";
      errorBox.style.display = "block";
      errorBox.textContent =
        "El enlace ha caducado, ya fue utilizado o no es válido. Solicita un nuevo correo de restablecimiento." +
        (error && error.message ? " " + error.message : "");
    });

    window.netlifyIdentity.on("open", function () {
      document.querySelector(".spinner").style.display = "none";
      status.textContent = "Escribe y confirma tu nueva contraseña en la ventana de acceso.";
    });
  })();
  </script>
</body>
</html>
