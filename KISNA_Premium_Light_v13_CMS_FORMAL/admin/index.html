<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Administración KISNA</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <noscript>Necesitas activar JavaScript para usar el panel de KISNA.</noscript>
  <script>
    (function () {
      var identityApi = 'https://kisnalisado.es/.netlify/identity';

      function loadCms() {
        if (document.querySelector('script[data-decap-cms]')) return;
        var script = document.createElement('script');
        script.src = 'https://unpkg.com/decap-cms@^3.8.0/dist/decap-cms.js';
        script.async = true;
        script.setAttribute('data-decap-cms', 'true');
        document.body.appendChild(script);
      }

      if (window.netlifyIdentity) {
        window.netlifyIdentity.init({ APIUrl: identityApi });
        window.netlifyIdentity.on('init', loadCms);
        window.netlifyIdentity.on('login', function () {
          window.netlifyIdentity.close();
        });
        setTimeout(loadCms, 1200);
      } else {
        loadCms();
      }
    }());
  </script>
</body>
</html>
